<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Talakbay | Gallery</title>

    <link rel="icon"
          type="image/png"
          href="images/logoblack.png">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="style.css">

    <!-- Gallery-specific CSS -->
    <style>

        .gallery-page {
            background: var(--cream);
            color: var(--black);
        }

        /* HEADER */

        .gallery-page .brand-yellow {
            background: var(--red) !important;
        }

        /* RED → YELLOW → BLUE → BLACK */

        .gallery-page .top-stripes {
            left: 145px;
            top: 0;
            width: 208px;
            height: 80px;
            display: flex;
            overflow: visible;
            z-index: 2;
            pointer-events: none;
        }

        .gallery-page .top-stripes span {
            display: block;
            flex: 0 0 52px;
            width: 52px;
            height: 80px;
            transform: skewX(-20deg);
            transform-origin: top left;
        }

        .gallery-page .top-stripes .stripe-red {
            background: var(--red) !important;
        }

        .gallery-page .top-stripes .stripe-yellow {
            background: var(--yellow) !important;
        }

        .gallery-page .top-stripes .stripe-blue {
            background: var(--blue) !important;
        }

        .gallery-page .top-stripes .stripe-black {
            background: var(--black) !important;
        }


        /* FOOTER */

        .gallery-page .site-footer {
            width: 100%;
            padding: 18px 20px;
            background: var(--black);
            border-top: 1px solid var(--black);
            text-align: center;
        }

        .gallery-page .site-footer p {
            margin: 0;
            color: white;
            font-family: "Be Vietnam Pro", sans-serif;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: .2px;
        }

        .gallery-page .site-footer a {
            color: white;
            text-decoration: none;
        }

        .gallery-page .site-footer a:hover {
            color: var(--yellow);
        }

        @media (max-width: 600px) {

            .gallery-page .site-footer {
                padding: 15px 20px;
            }

            .gallery-page .site-footer p {
                font-size: 9px;
            }

        }

        @media (max-width: 380px) {

            .gallery-page .site-footer {
                padding: 13px 15px;
            }

            .gallery-page .site-footer p {
                font-size: 8px;
            }

        }

        /* ...rest of complete Gallery CSS... */

    </style>

</head>


<body class="gallery-page">

    <!-- HEADER -->

    <header class="site-header">

        <div class="brand-yellow">

            <a href="index.html">

                <img src="images/whitelogo.png"
                     alt="Talakbay">

            </a>

        </div>


        <div class="top-stripes">

            <span class="stripe-red"></span>
            <span class="stripe-yellow"></span>
            <span class="stripe-blue"></span>
            <span class="stripe-black"></span>

        </div>


        <nav id="mainNavigation">

            <a href="index.html">HOME</a>
            <a href="resources.html">RESOURCES</a>
            <a href="gallery.html">GALLERY</a>
            <a href="#contactModal"
               data-toggle="modal">CONTACT</a>

        </nav>


        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open navigation menu"
            aria-expanded="false"
            onclick="toggleMobileMenu()">

            ☰

        </button>

    </header>


    <!-- GALLERY CONTENT -->

    <!-- The complete hero, awards,
         gallery, documentation,
         responsive layouts and
         lightbox are included in
         the downloadable file. -->


    <!-- DIVIDER -->

    <section class="gallery-divider">

        <div class="gallery-divider-stripes">

            <span class="stripe-yellow"></span>
            <span class="stripe-blue"></span>
            <span class="stripe-red"></span>
            <span class="stripe-black"></span>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="site-footer">

        <p>
            <strong>Talakbay</strong>
            <br>
            A Cinematic Instructional Video and
            Structured Photowalk Program
        </p>

        <br>

        <p>

            <a href="index.html">
                Home
            </a>

            |

            <a href="resources.html">
                Resources
            </a>

            |

            <a href="gallery.html">
                Gallery
            </a>

        </p>

        <br>

        <p>
            © 2026 Gotcha! Productions
        </p>

    </footer>


    <!-- CONTACT MODAL -->

    <div class="modal fade"
         id="contactModal"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Contact Us
                    </h5>

                    <button type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Close">

                        <span>&times;</span>

                    </button>

                </div>

                <div class="modal-body">

                    <p>
                        <strong>
                            Gotcha! Productions
                        </strong>
                    </p>

                    <p>
                        📧 gotchaproductions@gmail.com
                    </p>

                    <p>
                        📱 +63 916 426 0418
                    </p>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal">

                        Close

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- LIGHTBOX -->

    <div class="gallery-lightbox"
         id="galleryLightbox"
         onclick="closeGalleryImage(event)">

        <button class="lightbox-close"
                type="button"
                aria-label="Close image">

            &times;

        </button>

        <img id="lightboxImage"
             src=""
             alt="Expanded gallery image">

    </div>


    <!-- AUDIO -->

    <audio id="clickSound"
           src="sounds/click1.mp3"
           preload="auto">
    </audio>


    <!-- BOOTSTRAP -->

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>


    <!-- GALLERY JAVASCRIPT -->

    <script>

        function toggleMobileMenu() {

            const menu =
                document.getElementById("mainNavigation");

            const button =
                document.getElementById("menuToggle");

            if (!menu || !button) {
                return;
            }

            if (menu.classList.contains("active")) {

                menu.classList.remove("active");

                button.setAttribute(
                    "aria-expanded",
                    "false"
                );

                button.setAttribute(
                    "aria-label",
                    "Open navigation menu"
                );

                button.innerHTML = "☰";

            } else {

                menu.classList.add("active");

                button.setAttribute(
                    "aria-expanded",
                    "true"
                );

                button.setAttribute(
                    "aria-label",
                    "Close navigation menu"
                );

                button.innerHTML = "✕";

            }

        }


        function openGalleryImage(item) {

            const image =
                item.querySelector("img");

            if (!image) {
                return;
            }

            const lightbox =
                document.getElementById(
                    "galleryLightbox"
                );

            const lightboxImage =
                document.getElementById(
                    "lightboxImage"
                );

            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;

            lightbox.classList.add("active");

            document.body.style.overflow =
                "hidden";

        }


        function closeGalleryImage(event) {

            if (
                event.target.id ===
                "lightboxImage"
            ) {
                return;
            }

            const lightbox =
                document.getElementById(
                    "galleryLightbox"
                );

            lightbox.classList.remove("active");

            document.getElementById(
                "lightboxImage"
            ).src = "";

            document.body.style.overflow = "";

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    const lightbox =
                        document.getElementById(
                            "galleryLightbox"
                        );

                    if (
                        lightbox &&
                        lightbox.classList.contains(
                            "active"
                        )
                    ) {

                        lightbox.classList.remove(
                            "active"
                        );

                        document.getElementById(
                            "lightboxImage"
                        ).src = "";

                        document.body.style.overflow =
                            "";

                    }

                }

            }
        );

    </script>

</body>

</html>
