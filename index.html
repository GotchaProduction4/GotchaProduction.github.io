<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Talakbay | Home</title>

    <link rel="icon" type="image/png" href="images/logoblack.png">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body class="home-page">


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="navbar">


    <!-- LOGO + STRIPES -->

    <div class="brand">

        <a href="index.html">

            <img src="images/logoblack.png"
                 alt="Gotcha Productions"
                 class="logo">

        </a>


        <div class="top-stripes">

            <span class="blue"></span>
            <span class="red"></span>
            <span class="black"></span>

        </div>

    </div>



    <!-- NAVIGATION -->

    <div class="navigation">

        <a href="index.html"
           class="nav-button home active">

            HOME

        </a>


        <a href="resources.html"
           class="nav-button resources">

            RESOURCES

        </a>


        <a href="gallery.html"
           class="nav-button gallery">

            GALLERY

        </a>


        <a href="#"
           class="nav-button contact"
           data-toggle="modal"
           data-target="#contactModal">

            CONTACT

        </a>

    </div>

</nav>



<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">


    <!-- Faded Background -->

    <div class="hero-background"></div>



    <div class="hero-content">


        <!-- LEFT SIDE -->

        <div class="hero-text">

            <h1>TALAKBAY</h1>


            <p>
                A Cinematic Instructional Video Series Applied on a
                Structured Photowalk Program
            </p>


            <div class="hero-buttons">

                <a href="resources.html"
                   class="pill blue">

                    RESOURCES

                </a>


                <a href="gallery.html"
                   class="pill red">

                    GALLERY

                </a>

            </div>

        </div>



        <!-- RIGHT SIDE IMAGE -->

        <div class="hero-photo">

            <img src="images/photowalk.jpg"
                 alt="Students participating in a photowalk">

        </div>


    </div>



    <!-- BOTTOM RIGHT STRIPES -->

    <div class="hero-stripes">

        <span class="black"></span>

        <span class="red"></span>

        <span class="blue"></span>

        <span class="yellow"></span>

    </div>


</section>



<!-- =====================================================
     CONTACT MODAL
===================================================== -->

<div class="modal fade"
     id="contactModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    CONTACT US
                </h5>


                <button type="button"
                        class="close"
                        data-dismiss="modal">

                    <span>&times;</span>

                </button>

            </div>


            <div class="modal-body">

                <h4>
                    Gotcha! Productions
                </h4>

                <hr>

                <p>
                    📧 4gotchaproductions@gmail.com
                </p>

                <p>
                    📱 +63 916 426 0418
                </p>

            </div>


            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-dismiss="modal">

                    CLOSE

                </button>

            </div>


        </div>

    </div>

</div>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>

</html>
